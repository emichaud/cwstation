{% load theme_tags %}
<div class="cw-session-card {% if card.is_tx %}is-tx{% else %}is-rx{% endif %}">
    <a href="{{ card.detail_url }}" class="cw-sc-link" aria-label="Replay this session">
        <span class="cw-sc-rail" aria-hidden="true"></span>
        <span class="cw-sc-body">
            <span class="cw-sc-head">
                <span class="cw-badge cw-badge-{% if card.is_tx %}tx{% else %}rx{% endif %}">{% if card.is_tx %}TX{% else %}RX{% endif %}</span>
                <span class="cw-sc-source">{{ card.source_label }}</span>
                <time class="cw-sc-time">{{ card.when|date:"M j, Y" }} · {{ card.when|time:"g:i A" }}</time>
            </span>
            <span class="cw-sc-copy cw-mono">{{ card.text }}</span>
            <span class="cw-sc-meta">
                {% if card.wpm %}<span class="cw-sc-chip">{{ card.wpm }} wpm</span>{% endif %}
                {% for c in card.calls %}<span class="cw-badge cw-badge-call">{{ c }}</span>{% endfor %}
                <span class="cw-sc-replay">Replay <span aria-hidden="true">→</span></span>
            </span>
        </span>
    </a>
    <button type="button" class="cw-sc-del" title="Delete session" aria-label="Delete session"
            onclick="crudDeleteModal(this, 'this session')" data-delete-url="{{ card.delete_url }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7zm3-3h6l1 2H8l1-2zM4 6h16v1H4V6z"/></svg>
    </button>
</div>
